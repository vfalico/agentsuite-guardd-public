[build-system]
requires = ["setuptools>=77"]
build-backend = "guardd_build"
backend-path = ["_backend"]

[project]
name = "agentsuite-guardd"
version = "0.1.0"
description = "Generic AgentSuite enforcement provider"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name="Veaceslav Falico", email="vfalico@gmail.com"}]
dependencies = ["cryptography>=46,<47", "grpcio>=1.74,<2", "protobuf>=6.31.1,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "grpcio-tools==1.74.0"]

[project.scripts]
agentsuite-guardd = "agentsuite_guardd.cli:main"

[tool.setuptools.packages.find]
where=["src"]
